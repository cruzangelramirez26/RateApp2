# Mantiene despierto el servicio de Render free.
#
# Render free suspende el servicio tras ~15 min sin trafico (arranque frio 30-60s).
# Este workflow le pega a /health cada 10 min para que nunca llegue a ese limite.
#
# OJO con las horas de instancia: el free tier da 750 h/mes y estar despierto 24/7
# consume 744 h en un mes de 31 dias. Entra, pero con 6 h de margen y solo si este
# es el UNICO servicio free de la cuenta. Si te quedas corto, usa el cron recortado
# que esta comentado abajo.
#
# LIMITACION: GitHub deshabilita los workflows programados tras 60 dias sin
# actividad en el repo (avisa por correo). Ademas el cron de Actions en runners
# gratis se atrasa seguido, asi que un ping ocasional puede llegar tarde o perderse.
# Si eso pasa muy seguido, cron-job.org es mas puntual para este trabajo.

name: keep-awake

on:
  schedule:
    # Cada 10 minutos, 24/7.
    - cron: '*/10 * * * *'
    #
    # Variante recortada (mas margen de horas): despierto solo de 7:00 a 1:00
    # hora de Mexico centro (UTC-6) = 13:00-07:00 UTC. Comenta el cron de arriba
    # y descomenta este. Ajusta el rango si tu zona es UTC-7.
    # - cron: '*/10 13-23,0-7 * * *'
  workflow_dispatch:        # permite dispararlo a mano desde la pestana Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          # Desde 2026-08-22 la app vive en Cloud Run (us-east4). El ping ya no
          # es critico como lo era en Render: Cloud Run escala a cero pero
          # arranca en segundos, no en 30-60s. Se mantiene porque conserva una
          # instancia tibia a costo ~cero — con facturacion basada en
          # solicitudes la CPU solo se cobra durante el request, y 4,320 pings
          # al mes no son nada contra los 2 millones del nivel gratuito.
          #
          # --max-time 90 y los retries aguantan un arranque frio, que es justo
          # cuando el ping importa (tras un redeploy o si se perdio el anterior).
          curl --fail --silent --show-error \
               --max-time 90 \
               --retry 3 --retry-delay 15 --retry-all-errors \
               --write-out 'status=%{http_code} tiempo=%{time_total}s\n' \
               https://rateapp-1043427819721.us-east4.run.app/health
