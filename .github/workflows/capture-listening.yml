# RED DE SEGURIDAD de la captura de escuchas. NO es el mecanismo principal.
#
# El principal es un job de **Cloud Scheduler** (`capture-listening`, region
# us-east4, proyecto rateapp-506404) que corre cada 15 min y es puntual de
# verdad.
#
# POR QUE SE DEGRADO ESTE WORKFLOW A RESPALDO:
# nacio pidiendo `*/30 * * * *` y GitHub lo corria cada **2 a 5 horas** — se
# midieron 12 corridas seguidas con un hueco peor de 5.1 h. El cron de Actions
# en runners gratis no es una promesa, es una sugerencia. Y aqui el atraso
# cuesta datos: /me/player/recently-played devuelve como maximo las ULTIMAS 50
# reproducciones, o sea ~2.9 horas de escucha seguida, asi que un hueco de 5 h
# puede perder reproducciones que NO se recuperan. (Al momento del cambio
# todavia no se habia perdido nada: el maximo devuelto fue 23 de 50.)
#
# Se deja vivo, cada 6 horas, porque el riesgo que cubre es la perdida
# irreversible de historial: si el job de Cloud Scheduler se borra, se
# deshabilita la API o falla la facturacion, esto sigue capturando. La captura
# es idempotente (filtra por cursor Y por played_at), asi que solaparse con
# Cloud Scheduler no cuenta nada dos veces.
#
# Si algun dia se quita Cloud Scheduler, hay que volver a subirle la frecuencia
# a este — sabiendo que igual se va a atrasar.

name: capture-listening (respaldo)

on:
  schedule:
    - cron: '17 */6 * * *'   # cada 6 h, en el minuto 17 para no pegarse a la hora en punto
  workflow_dispatch:         # para dispararlo a mano desde la pestana Actions

concurrency:
  group: capture-listening
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capturar reproducciones nuevas
        run: |
          # --data '' NO es adorno: manda Content-Length: 0. Sin eso el
          # balanceador de Google rechaza el POST con 411 (Length Required)
          # ANTES de que llegue a la app, y la captura no correria nunca.
          # Comprobado contra produccion: POST pelado -> 411, con --data '' -> 200.
          #
          # --max-time 90 y los retries aguantan un arranque frio de Cloud Run.
          # --fail hace que un 5xx tumbe el paso, para que se note en la pestana
          # Actions en vez de fallar en silencio durante semanas.
          curl --fail --silent --show-error \
               --request POST --data '' \
               --max-time 90 \
               --retry 3 --retry-delay 15 --retry-all-errors \
               --write-out '\nstatus=%{http_code} tiempo=%{time_total}s\n' \
               https://rateapp-1043427819721.us-east4.run.app/tracks/listening/capture
