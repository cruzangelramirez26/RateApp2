[package]
name = "app"
version = "0.1.0"
description = "Cascaron nativo de RateApp (Windows)"
authors = ["Angel RG"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# "tray-icon" es lo que habilita TrayIconBuilder. Sin la feature, el codigo de
# la bandeja no compila aunque el crate sea el mismo.
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
# La ventana se OCULTA al cerrar, asi que abrir el acceso directo otra vez
# lanzaria una segunda instancia: dos iconos en la bandeja y la ventana vieja
# perdida. Este plugin mata a la nueva y trae al frente la que ya corria.
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
# Los atajos califican sin abrir ninguna ventana, asi que el unico aviso de que
# la calificacion se guardo es una notificacion del sistema.
tauri-plugin-notification = "2"
# Para hablarle al backend desde Rust. Los atajos globales no pueden pasar por
# el frontend: la pagina es REMOTA (Cloud Run) y darle acceso a comandos de
# Tauri exigiria abrirle permisos al origen remoto.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
